name: BeagleStream Client Release

on:
  push:
    branches:
      - beagle/phase-a
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beagle-stream-client-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      ci_version: ${{ steps.version.outputs.ci_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        run: |
          base_version="$(tr -d "[:space:]" < app/version.txt)"
          if [[ -z "${base_version}" ]]; then
            echo "app/version.txt must contain a version" >&2
            exit 1
          fi
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          ci_version="${base_version}-${short_sha}"
          release_tag="beagle-v${base_version}-${short_sha}"
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "ci_version=${ci_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_title=BeagleStream Client ${base_version} (${short_sha})" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: version
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.version.outputs.ci_version }}

  publish:
    needs:
      - version
      - build-appimage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download AppImage artifact
        uses: actions/download-artifact@v5
        with:
          name: BeagleStream-LinuxAppImage-${{ needs.version.outputs.ci_version }}
          path: dist/

      - name: Prepare release assets
        run: |
          version="${{ needs.version.outputs.ci_version }}"
          test -f "dist/BeagleStream-${version}-x86_64.AppImage"
          cp "dist/BeagleStream-${version}-x86_64.AppImage" "dist/BeagleStream-latest-x86_64.AppImage"
          sha256sum dist/BeagleStream-*.AppImage > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Publish immutable Beagle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.release_tag }}"
          title="${{ needs.version.outputs.release_title }}"
          notes="BeagleStream Client ${tag} built from ${GITHUB_SHA}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/BeagleStream-*.AppImage dist/SHA256SUMS
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" dist/BeagleStream-*.AppImage dist/SHA256SUMS \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
